spring:
  application:
    name: kanarau-api

  profiles:
    active: dev

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# JWT & CORS Configuration
kanarau:
  jwt:
    secret: ${JWT_SECRET:kanarau-dev-secret-key-that-is-at-least-256-bits-long-for-hs256-signing}
    expiration-ms: 86400000  # 24 hours
  cors:
    allowed-origins: ${KANARAU_CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,https://*.vercel.app}

# Server
server:
  port: ${SERVER_PORT:8085}
  servlet:
    context-path: /api/v1
  error:
    include-message: always
    include-binding-errors: always

---
# Dev Profile (H2)
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: "jdbc:h2:mem:kanarau;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=RUNSCRIPT FROM 'classpath:db/h2-init.sql'"
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    locations: classpath:db/migration

---
# Prod Profile (PostgreSQL)
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kanarau}
    username: ${DB_USERNAME:kanarau}
    password: ${DB_PASSWORD:kanarau_dev}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    locations: classpath:db/migration

kanarau:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${KANARAU_CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,https://*.vercel.app}
