<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient: Deep Indigo to Royal Violet -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>

    <!-- Japanese Vermilion Red Accent Gradient -->
    <linearGradient id="accentSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <!-- Subtle Inner Glow / Border -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.05" />
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.35" flood-color="#0F172A" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGradient)" stroke="url(#borderGlow)" stroke-width="1.5" />

  <!-- Japanese Rising Sun Accent (Subtle Zen Circle behind the Kanji) -->
  <circle cx="84" cy="44" r="18" fill="url(#accentSun)" opacity="0.85" />

  <!-- Zen Enso Brush Arc (Symbolizing Enlightenment & Mastery in JLPT) -->
  <path d="M 36 84 C 28 66 36 44 54 36 C 72 28 92 36 96 48" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        opacity="0.22" />

  <!-- Kanji "仮" (Kanarau - Japanese Kana/Kanji Learning) -->
  <text x="64" y="88" 
        font-family="'Shippori Mincho', 'Noto Sans JP', 'Hiragino Mincho ProN', 'Yu Mincho', serif" 
        font-size="62" 
        font-weight="800" 
        fill="#FFFFFF" 
        text-anchor="middle"
        filter="url(#dropShadow)">仮</text>
</svg>