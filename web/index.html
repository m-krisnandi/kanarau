<!DOCTYPE html>
<html lang="en" class="notranslate" translate="no">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var lang = localStorage.getItem('kanarau_lang');
          if (!lang) {
            var raw = localStorage.getItem('kanarau-language');
            if (raw) {
              var parsed = JSON.parse(raw);
              lang = parsed && parsed.state && parsed.state.language;
            }
          }
          if (lang === 'my' || lang === 'id' || lang === 'en') {
            document.documentElement.lang = lang;
          } else {
            document.documentElement.lang = 'en';
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF8F5" />
    <meta name="description" content="Kanarau - Japanese Vocabulary & Kanji SRS" />
        <meta name="google" content="notranslate" />
    <meta name="googlebot" content="notranslate" />
    <link rel="manifest" href="/manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

</html>
